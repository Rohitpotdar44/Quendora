<?xml version="1.0" encoding="UTF-8"?>
<svg width="900" height="540" viewBox="0 0 900 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">myJournalApp Cost Estimate (INR/month)</title>
  <desc id="desc">Bar chart showing monthly self-hosted cost breakdown and student free tier note</desc>

  <!-- Background -->
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f7f9fc"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="900" height="540" fill="url(#bgGrad)"/>

  <!-- Header -->
  <text x="450" y="48" text-anchor="middle" font-family="Inter, Segoe UI, Roboto, Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a">
    myJournalApp • Cost Estimate (INR / month)
  </text>
  <text x="450" y="74" text-anchor="middle" font-family="Inter, Segoe UI, Roboto, Arial, sans-serif" font-size="14" fill="#475569">
    Self-hosted baseline for student demo; use as slide visual
  </text>

  <!-- Axes and scale -->
  <!-- Scale: 1 INR = 0.2 px → ₹1,250 ≈ 250 px -->
  <g transform="translate(160, 120)">
    <!-- X-axis scale -->
    <line x1="200" y1="-20" x2="700" y2="-20" stroke="#e2e8f0" stroke-width="1"/>
    <text x="200" y="-30" font-family="Inter, Segoe UI, Roboto, Arial, sans-serif" font-size="12" fill="#64748b">0</text>
    <text x="325" y="-30" font-family="Inter, Segoe UI, Roboto, Arial, sans-serif" font-size="12" fill="#64748b">₹500</text>
    <text x="450" y="-30" font-family="Inter, Segoe UI, Roboto, Arial, sans-serif" font-size="12" fill="#64748b">₹1,000</text>
    <text x="575" y="-30" font-family="Inter, Segoe UI, Roboto, Arial, sans-serif" font-size="12" fill="#64748b">₹1,500</text>

    <!-- Bars data (values use scale 0.2 px per ₹) -->
    <!-- VPS (App + DB): ₹1,250 → 250 px -->
    <text x="0" y="20" font-family="Inter, Segoe UI, Roboto, Arial, sans-serif" font-size="14" fill="#0f172a">VPS (App + DB)</text>
    <rect x="200" y="2" width="250" height="28" rx="6" fill="#2563eb"/>
    <text x="460" y="22" font-family="Inter, Segoe UI, Roboto, Arial, sans-serif" font-size="13" fill="#0f172a">₹1,250</text>

    <!-- Bandwidth: ₹275 → 55 px -->
    <text x="0" y="70" font-family="Inter, Segoe UI, Roboto, Arial, sans-serif" font-size="14" fill="#0f172a">Bandwidth</text>
    <rect x="200" y="52" width="55" height="28" rx="6" fill="#10b981"/>
    <text x="265" y="72" font-family="Inter, Segoe UI, Roboto, Arial, sans-serif" font-size="13" fill="#0f172a">₹275</text>

    <!-- Storage: ₹100 → 20 px -->
    <text x="0" y="120" font-family="Inter, Segoe UI, Roboto, Arial, sans-serif" font-size="14" fill="#0f172a">Storage</text>
    <rect x="200" y="102" width="20" height="28" rx="6" fill="#f59e0b"/>
    <text x="230" y="122" font-family="Inter, Segoe UI, Roboto, Arial, sans-serif" font-size="13" fill="#0f172a">₹100</text>

    <!-- Domain (optional): ₹100 → 20 px -->
    <text x="0" y="170" font-family="Inter, Segoe UI, Roboto, Arial, sans-serif" font-size="14" fill="#0f172a">Domain (optional)</text>
    <rect x="200" y="152" width="20" height="28" rx="6" fill="#8b5cf6"/>
    <text x="230" y="172" font-family="Inter, Segoe UI, Roboto, Arial, sans-serif" font-size="13" fill="#0f172a">₹100</text>

    <!-- SSL / Email / Monitoring: ₹0 → 0 px -->
    <text x="0" y="220" font-family="Inter, Segoe UI, Roboto, Arial, sans-serif" font-size="14" fill="#0f172a">SSL / Email / Monitoring</text>
    <rect x="200" y="202" width="2" height="28" rx="6" fill="#94a3b8"/>
    <text x="210" y="222" font-family="Inter, Segoe UI, Roboto, Arial, sans-serif" font-size="13" fill="#0f172a">₹0 (free tiers)</text>

    <!-- Total range note -->
    <rect x="200" y="260" width="420" height="52" rx="10" fill="#f1f5f9" stroke="#e2e8f0"/>
    <text x="410" y="292" text-anchor="middle" font-family="Inter, Segoe UI, Roboto, Arial, sans-serif" font-size="14" fill="#0f172a">
      Typical monthly budget (self-hosted): ₹1,000 – ₹2,000
    </text>
  </g>

  <!-- Free tier callout -->
  <g transform="translate(80, 400)">
    <rect x="0" y="0" width="740" height="90" rx="12" fill="#ecfeff" stroke="#06b6d4"/>
    <text x="20" y="34" font-family="Inter, Segoe UI, Roboto, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">
      Student/Free Credits
    </text>
    <text x="20" y="62" font-family="Inter, Segoe UI, Roboto, Arial, sans-serif" font-size="14" fill="#0f172a">
      During evaluation, total can be ₹0/month using student credits and free tiers.
    </text>
  </g>

  <!-- Footer note -->
  <text x="450" y="520" text-anchor="middle" font-family="Inter, Segoe UI, Roboto, Arial, sans-serif" font-size="12" fill="#64748b">
    Values are indicative midpoints for presentation; actual spend depends on usage and provider.
  </text>
</svg>


